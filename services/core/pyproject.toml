[project]
name = "realtime-system-transcriber-core"
version = "0.1.0"
description = "Local-first realtime system audio transcriber with ASR and LLM analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "keyring>=25.6.0",
  "httpx>=0.28.0",
  "sounddevice>=0.5.0",
  "numpy>=2.2.0",
  "faster-whisper>=1.1.1",
  "orjson>=3.11.0",
  "loguru>=0.7.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
